name: Compile Dragonfly
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.2'
      - name: Build ARM64
        run: GOOS=linux GOARCH=arm64 go build -o dragonfly-arm64 main.go
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dragonfly-bin-arm64
          path: dragonfly-arm64
