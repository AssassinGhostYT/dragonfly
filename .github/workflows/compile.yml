name: Compile Dragonfly

on:
  push:
    branches: [ "infested-blocks-test" ]
  pull_request:
    branches: [ "infested-blocks-test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Sync Dependencies
        run: |
          go mod tidy

      - name: Build ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -o dragonfly-arm64 -v main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonfly-bin-arm64
          path: dragonfly-arm64
