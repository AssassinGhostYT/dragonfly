name: Build ARM64 Binary

on:
  push:
    branches: [ "infested-blocks-test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Sync Dependencies
        run: |
          go mod tidy

      - name: Build Dragonfly ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -v -o dragonfly_server_arm64 main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonfly-server-bin
          path: dragonfly_server_arm64
